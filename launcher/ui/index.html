<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion 启动器</title>
<style>
:root{color-scheme:dark;--bg:#1b2230;--surface:#232e3c;--line:#415367;--text:#f2f7fa;--muted:#bacbd8;--ice:#8fe3f5;--cyan:#5ec8e6;--green:#9de1bb;--red:#ffb3b5;--gold:#f5d38e}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Microsoft YaHei UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:6px;background:#2c3949;color:var(--text);padding:10px 16px}button:hover:not(:disabled){border-color:var(--ice);background:#35485a}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}main{max-width:1040px;margin:auto;padding:40px 28px 28px}header{display:flex;gap:22px;align-items:center;padding-bottom:28px;border-bottom:1px solid var(--line)}canvas{width:72px;height:72px;flex:none;image-rendering:pixelated;background:#303e50;border-radius:6px;box-shadow:0 6px 24px #10151e80}h1{font-size:30px;line-height:1.3;margin:0 0 5px;font-weight:700}p{margin:0;color:var(--muted)}.brand{font-size:11px;color:var(--ice);font-weight:700;margin-bottom:3px}.last{margin-left:auto;max-width:230px;font-size:12px;text-align:right;color:var(--muted)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0}.primary{background:var(--ice);color:#102733;border-color:var(--ice);min-width:210px;font-size:19px;font-weight:700;padding:14px 25px;box-shadow:0 5px 18px #0d141d66}.primary:hover:not(:disabled){background:#b7eff9;color:#102733}.primary.stop{background:#f5d38e;border-color:#f5d38e;color:#302311}.quit{margin-left:auto}.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.status{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-height:107px;box-shadow:0 4px 12px #10151e40}.status h2{margin:0 0 8px;font-size:16px}.status p{font-size:13px;overflow-wrap:anywhere}.lamp{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;background:#a6b4c2}.running .lamp,.passed .lamp{background:var(--green)}.starting .lamp{background:var(--gold);animation:pulse 1.4s infinite}.error .lamp{background:var(--red)}.status.error{border-color:var(--red)}.progress{margin:24px 0 8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));list-style:none;padding:0;gap:4px}.progress li{border-top:3px solid var(--line);padding:9px 2px;color:var(--muted);font-size:12px;min-height:47px;text-align:center}.progress .current{border-color:var(--ice);color:var(--ice)}.progress .done{border-color:var(--green);color:var(--green)}.progress .failed{border-color:var(--red);color:var(--red)}#notice{min-height:28px;font-size:13px;color:var(--red);overflow-wrap:anywhere}.section{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}summary{cursor:pointer;min-height:42px;font-weight:700;font-size:17px}summary span{float:right;font-size:12px;font-weight:400;color:var(--muted)}.settings-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:10px 0 18px}#save-status{color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}.field{min-width:0}.field.wide{grid-column:1/-1}label{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:7px;font-size:13px;color:var(--text)}.badge{font-size:10px;border-radius:3px;padding:1px 6px;background:#354656;color:#e2eef4}.badge[data-source=detected]{color:var(--ice)}.badge[data-source=saved]{color:var(--green)}input[type=text],input[type=url],select{width:100%;border:1px solid var(--line);background:#18212c;color:var(--text);border-radius:5px;min-height:43px;padding:8px 11px}input[type=range]{width:100%;accent-color:var(--ice);height:30px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ice);flex:none}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;grid-column:1/-1;margin:6px 0 18px}.toggles label{margin:0;min-height:35px}.toggles .badge{margin-left:auto}.log-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.log-head h2{font-size:17px;margin:0}.tabs{display:flex;gap:4px}.tabs button{padding:6px 16px;min-height:36px;font-size:13px}.tabs button[aria-selected=true]{background:var(--ice);color:#102733;border-color:var(--ice)}.log{height:235px;overflow:auto;border:1px solid var(--line);background:#131c26;border-radius:6px;padding:14px;font:12px/1.7 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#d4e2ec}.footer{margin-top:16px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.snow{position:fixed;top:-15px;color:#a8d7e8;opacity:.35;pointer-events:none;animation:snowfall 20s linear infinite;font-size:14px;z-index:-1}.snow:nth-child(1){left:7%;animation-delay:-7s}.snow:nth-child(2){left:90%;animation-delay:-14s}.snow:nth-child(3){left:44%;animation-delay:-2s}@keyframes snowfall{to{transform:translateY(110vh) rotate(180deg)}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}@media(max-width:650px){main{padding:22px 16px}header{gap:16px;flex-wrap:wrap}h1{font-size:26px}.last{margin-left:88px;text-align:left;max-width:none}.actions{gap:8px}.primary{width:100%}.actions button:not(.primary){flex:1;padding:9px 10px;font-size:13px}.quit{margin-left:0}.status-grid{gap:8px}.status{padding:12px 9px}.status h2{font-size:14px}.status p{font-size:12px}.fields{grid-template-columns:1fr}.toggles{grid-template-columns:1fr}.progress{grid-template-columns:repeat(4,minmax(0,1fr))}.progress li{min-height:40px}.log{height:210px}summary span{float:none;margin-left:12px}.footer{flex-wrap:wrap;gap:8px}}
.snow{z-index:0;width:12px;height:1px;background:#a8d7e8}.snow::before,.snow::after{content:"";position:absolute;inset:0;background:inherit;transform:rotate(60deg)}.snow::after{transform:rotate(-60deg)}main{position:relative;z-index:1}
</style>
</head>
<body>
<div aria-hidden="true"><span class="snow"></span><span class="snow"></span><span class="snow"></span></div>
<main>
<header><canvas id="avatar" width="8" height="8" role="img" aria-label="Companion 的头像"></canvas><div><div class="brand">MINECRAFT COMPANION</div><h1>Companion 启动器</h1><p>今天，也一起回到方块世界。</p></div><div id="last" class="last">尚未开始</div></header>
<div class="actions"><button id="start" class="primary">一键开始</button><button id="restart" disabled>重启 Companion</button><button id="planks" disabled>给她 4 块木板</button><button id="demo" disabled>一键演示（约 30–40 分钟，独立测试世界，不动你的存档）</button><button id="quit" class="quit">关闭启动器</button></div>
<div class="status-grid" id="statuses" aria-live="polite"><article class="status" id="server-status"><h2><span class="lamp"></span>服务器</h2><p>未启动</p></article><article class="status" id="bot-status"><h2><span class="lamp"></span>Companion</h2><p>未启动</p></article><article class="status" id="game-status"><h2><span class="lamp"></span>游戏</h2><p>未启动</p></article><article class="status" id="demo-status"><h2><span class="lamp"></span>演示</h2><p>未启动</p></article></div>
<ol class="progress" aria-label="启动进度"><li data-step="preflight">预检</li><li data-step="server">服务器</li><li data-step="permissions">权限</li><li data-step="bot">Companion</li><li data-step="skin">皮肤</li><li data-step="server-list">服务器列表</li><li data-step="pcl">PCL</li></ol>
<div id="notice" role="status" aria-live="polite"></div>
<details class="section" id="settings-panel"><summary>启动设置 <span>设置与记忆</span></summary><div class="settings-head"><span id="save-status" role="status">已就绪</span><button id="detect">重新检测</button></div><form id="settings" class="fields" autocomplete="off">
<div class="field"><label for="playerName">玩家名 <span class="badge" data-badge="playerName"></span></label><input id="playerName" type="text" maxlength="16" spellcheck="false"></div>
<div class="field"><label for="mcVersion">Minecraft 版本 <span class="badge" data-badge="mcVersion"></span></label><input id="mcVersion" type="text" spellcheck="false"></div>
<div class="field wide"><label for="pclExe">PCL 路径 <span class="badge" data-badge="pclExe"></span></label><input id="pclExe" type="text" spellcheck="false"></div>
<div class="field wide"><label for="mcDir">Minecraft 目录 <span class="badge" data-badge="mcDir"></span></label><input id="mcDir" type="text" spellcheck="false"></div>
<div class="field wide"><label for="javaExe">Java 路径 <span class="badge" data-badge="javaExe"></span></label><input id="javaExe" type="text" spellcheck="false"></div>
<div class="field wide"><label for="serverMemoryMB">服务器内存 <output id="memory" for="serverMemoryMB">1536 MB</output><span class="badge" data-badge="serverMemoryMB"></span></label><input id="serverMemoryMB" type="range" min="1024" max="4096" step="1" value="1536"></div>
<div class="toggles"><label for="brainEnabled"><input id="brainEnabled" type="checkbox">开启大脑<span class="badge" data-badge="brainEnabled"></span></label><label for="applySkin"><input id="applySkin" type="checkbox">应用 Companion 皮肤<span class="badge" data-badge="applySkin"></span></label><label for="allowCommands"><input id="allowCommands" type="checkbox">允许框架方块指令<span class="badge" data-badge="allowCommands"></span></label><label for="addServerEntry"><input id="addServerEntry" type="checkbox">加入服务器列表<span class="badge" data-badge="addServerEntry"></span></label><label for="openPcl"><input id="openPcl" type="checkbox">打开 PCL<span class="badge" data-badge="openPcl"></span></label></div>
<div class="field"><label for="skinUrl">皮肤 URL <span class="badge" data-badge="skinUrl"></span></label><input id="skinUrl" type="url" spellcheck="false"></div><div class="field"><label for="skinVariant">皮肤模型 <span class="badge" data-badge="skinVariant"></span></label><select id="skinVariant"><option value="classic">Classic · 粗手臂</option><option value="slim">Slim · 细手臂</option></select></div>
</form></details>
<section class="section"><div class="log-head"><h2>运行日志</h2><div class="tabs" role="tablist" aria-label="日志来源"><button id="tab-server" role="tab" aria-selected="true" aria-controls="log" tabindex="0" data-source="server">服务器</button><button id="tab-bot" role="tab" aria-selected="false" aria-controls="log" tabindex="-1" data-source="bot">Companion</button><button id="tab-demo" role="tab" aria-selected="false" aria-controls="log" tabindex="-1" data-source="demo">演示</button></div></div><div id="log" class="log" role="tabpanel" aria-labelledby="tab-server" tabindex="0"></div></section>
<div class="footer"><span>127.0.0.1 · 本机测试服</span><span id="connection" role="status">正在连接</span></div>
</main>
<script>
const $=id=>document.getElementById(id);
const hash=new URLSearchParams(location.hash.slice(1));
if(hash.get('t')){sessionStorage.setItem('launcher-token',hash.get('t'));history.replaceState(null,'',location.pathname+location.search);}
const token=sessionStorage.getItem('launcher-token')||'';
let state=null,pending={},inFlight={},saving=Promise.resolve(),saveTimer,actionBusy=false,polling=false,closed=false,source='server',localError='';
const logs={server:[],bot:[],demo:[]},seq={server:0,bot:0,demo:0};
async function api(path,body){const options={headers:{'X-Launcher-Token':token}};if(body!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}const response=await fetch('/api/'+path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data;}
function settingsView(settings){for(const [key,value]of Object.entries(settings.values)){const input=$(key);if(input&&document.activeElement!==input&&!Object.hasOwn(pending,key)&&!inFlight[key]){if(input.type==='checkbox')input.checked=value;else input.value=value;}const badge=document.querySelector('[data-badge="'+key+'"]');if(badge){badge.dataset.source=settings.sources[key];badge.textContent={saved:'已记住',detected:'自动检测',default:'默认'}[settings.sources[key]];}}$('memory').value=$('serverMemoryMB').value+' MB';$('last').textContent=settings.values.lastStartedAt?'上次开始 '+new Date(settings.values.lastStartedAt).toLocaleString('zh-CN'):'尚未开始';}
function render(next){state=next;settingsView(next.settings);for(const [key,value]of Object.entries(next.components)){const card=$(key+'-status');card.className='status '+value.status;card.querySelector('p').textContent=value.text;}$('start').textContent=next.active?'停止全部':'一键开始';$('start').classList.toggle('stop',next.active);$('start').disabled=actionBusy;$('restart').disabled=actionBusy||next.busy||next.components.server.status!=='running';$('planks').disabled=actionBusy||next.busy||next.components.bot.status!=='running';$('quit').disabled=actionBusy;$('demo').disabled=actionBusy||next.components.demo?.status==='running';const steps=[...document.querySelectorAll('[data-step]')];const current=steps.findIndex(item=>item.dataset.step===next.step);steps.forEach((item,index)=>{item.className=index<current||next.stepStatus==='complete'&&index===current?'done':index===current?(next.stepStatus==='error'?'failed':'current'):'';if(index===current)item.setAttribute('aria-current','step');else item.removeAttribute('aria-current');});$('notice').textContent=localError||next.lastError||'';}
function flush(){clearTimeout(saveTimer);const patch=pending;pending={};if(!Object.keys(patch).length)return saving;for(const key of Object.keys(patch))inFlight[key]=(inFlight[key]||0)+1;saving=saving.catch(()=>{}).then(async()=>{try{settingsView(await api('settings',patch));$('save-status').textContent='已保存';}catch(error){pending={...patch,...pending};$('save-status').textContent='保存失败';throw error;}finally{for(const key of Object.keys(patch))if(--inFlight[key]===0)delete inFlight[key];}});return saving;}
$('settings').addEventListener('submit',event=>event.preventDefault());
$('settings').addEventListener('input',event=>{const input=event.target;if(!input.id)return;pending[input.id]=input.type==='checkbox'?input.checked:input.type==='range'?Number(input.value):input.value;if(input.id==='serverMemoryMB')$('memory').value=input.value+' MB';$('save-status').textContent='待保存';clearTimeout(saveTimer);saveTimer=setTimeout(()=>flush().catch(error=>{$('notice').textContent=error.message;}),500);});
async function action(name){if(actionBusy)return;actionBusy=true;localError='';if(state)render(state);try{if(name==='start'||name==='detect')await flush();const data=await api(name,{});if(name==='detect')settingsView(data);if(name==='quit'){closed=true;$('connection').textContent='启动器已关闭';$('notice').textContent='已停止服务器和 Companion';document.querySelectorAll('button,input,select').forEach(control=>control.disabled=true);return;}render(await api('state'));}catch(error){localError=error.message;$('notice').textContent=localError;}finally{actionBusy=false;if(state&&!closed)render(state);}}
$('start').onclick=()=>action(state?.active?'stop':'start');$('restart').onclick=()=>action('restart-companion');$('planks').onclick=()=>action('give-planks');$('quit').onclick=()=>action('quit');$('detect').onclick=()=>action('detect');$('demo').onclick=()=>action('demo');
function drawLogs(){const panel=$('log');const lines=source==='demo'?logs.demo.filter(line=>/E2E V1 (S\d+ )?(PASS|FAIL)|^Companion: /.test(line.text)):logs[source];panel.textContent=lines.map(line=>line.text).join('\n');panel.scrollTop=panel.scrollHeight;}
function selectTab(button){source=button.dataset.source;document.querySelectorAll('[data-source]').forEach(tab=>{tab.setAttribute('aria-selected',String(tab===button));tab.tabIndex=tab===button?0:-1;});$('log').setAttribute('aria-labelledby',button.id);drawLogs();}
document.querySelectorAll('.tabs button').forEach(button=>{button.onclick=()=>selectTab(button);button.onkeydown=event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const target=$(event.key==='Home'?'tab-server':event.key==='End'?'tab-bot':source==='server'?'tab-bot':'tab-server');selectTab(target);target.focus();}};});
async function poll(){if(polling||closed)return;polling=true;try{const next=await api('state');render(next);await Promise.all(['server','bot','demo'].map(async key=>{const data=await api('logs?source='+key+'&after='+seq[key]);if(data.lines.length){seq[key]=data.lines.at(-1).seq;logs[key].push(...data.lines);logs[key]=logs[key].slice(-500);}}));drawLogs();$('connection').textContent='已连接';}catch(error){$('connection').textContent='连接中断';$('notice').textContent=error.message;}finally{polling=false;}}
const skin=new Image();skin.onload=()=>{const context=$('avatar').getContext('2d');context.imageSmoothingEnabled=false;context.drawImage(skin,8,8,8,8,0,0,8,8);context.drawImage(skin,40,8,8,8,0,0,8,8);};skin.src='/skin.png';
poll();setInterval(poll,1000);
</script>
</body>
</html>
